<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
:root{--p:0}
.scene{position:fixed;inset:0;display:grid;place-items:center;transform:scale(calc(1 + var(--p)*var(--p)*.35))}
.box{position:relative;height:100vh;aspect-ratio:1}
.L{position:absolute;left:16.587%;top:11.404%;width:66.986%;height:81.021%}
.light{position:absolute;inset:0;background:radial-gradient(ellipse 55% 65% at 50% 60%,#fff1c9 0%,#f2c674 22%,#a8652a 50%,#2a1408 85%);}
.dust{position:absolute;inset:0;background:radial-gradient(circle,#ffe6b333 1px,transparent 1.5px) 0 0/23px 31px,radial-gradient(circle,#ffe6b322 1px,transparent 1.5px) 11px 7px/37px 29px;mix-blend-mode:screen;opacity:var(--p)}
.leaves{position:absolute;inset:0;perspective:1400px;perspective-origin:50% 55%}
.leaf{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;background-size:100% 100%}
.leaf.l{left:0;background-image:url(/gate/gate-leaf-left.webp);transform-origin:left center;transform:rotateY(calc(var(--p)*-84deg))}
.leaf.r{right:0;background-image:url(/gate/gate-leaf-right.webp);transform-origin:right center;transform:rotateY(calc(var(--p)*84deg))}
.leaf::before{content:"";position:absolute;inset:0;background:#000;opacity:calc(var(--p)*.55)}
.edge{position:absolute;top:1.5%;bottom:0;width:22px;background:linear-gradient(90deg,#120a05,#2b1a0e 40%,#1a0f07);}
.leaf.l .edge{right:0;transform-origin:right center;transform:rotateY(90deg)}
.leaf.r .edge{left:0;transform-origin:left center;transform:rotateY(-90deg)}
.frame{position:absolute;inset:0;background:url(/gate/gate-frame.webp) 0 0/100% 100%}
.seam{position:absolute;left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%);background:linear-gradient(#0000,#ffcf7a 12%,#ffd88f 85%,#ffb85a);box-shadow:0 0 10px 2px #ffb85a99,0 0 40px 6px #ff9a3a44;opacity:calc(1 - var(--p)*4)}
.side{position:absolute;inset:0;background:linear-gradient(90deg,#000 0,#0000 18%,#0000 82%,#000 100%);pointer-events:none}
.vig{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 55%,#0000 45%,#000d 100%);pointer-events:none}
.ui{position:fixed;left:0;right:0;bottom:7%;text-align:center;opacity:calc(1 - var(--p)*5)}
.logo{width:min(34vw,420px);margin:0 auto 22px;color:#d7d9db;filter:drop-shadow(0 6px 14px #000)}
.btn{display:inline-block;margin:0 8px;font:14px Georgia,serif;letter-spacing:.28em;text-transform:uppercase;padding:14px 26px;color:#ecdcb8;border:1px solid #c9a96a99;background:#0a0705d0}
.btn.main{border-color:#e6c47e;box-shadow:inset 0 0 24px #c9a96a40}
.hint{margin-top:14px;font:12px Georgia,serif;letter-spacing:.2em;color:#8a8170}
.logowrap{position:fixed;left:0;right:0;top:6%;text-align:center;opacity:calc(1 - var(--p)*5)}
</style></head><body>
<div class="scene"><div class="box">
  <div class="leaves"><div class="leaf l"><div class="edge"></div></div><div class="leaf r"><div class="edge"></div></div></div>
 </div>
 <div class="frame"></div>
 <div class="L"><div class="seam"></div></div>
</div><div class="side"></div></div>
<div class="vig"></div>
<div class="logowrap"><div class="logo" id="logo"></div></div>
<div class="ui"><span class="btn main">Enter with sound</span><span class="btn">Enter in silence</span><div class="hint">HEADPHONES RECOMMENDED</div></div>
<script>
const p=parseFloat(new URLSearchParams(location.search).get('p')||0);document.documentElement.style.setProperty('--p',p);
fetch("/src/assets/logo/thewitcher-logo.svg").then(r=>r.text()).then(t=>{logo.innerHTML=t;document.title='ok'})
</script></body></html>
